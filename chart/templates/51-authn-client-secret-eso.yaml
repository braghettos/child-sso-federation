{{/*
51 — krateo-authn client secret, DECLARATIVE (epic #1)

Replaces the tail of 50-job-realm-apply: the part that polls until the krateo-authn
client has reconciled into the realm, GETs its client-secret from the Keycloak Admin
API, and writes it into the krateo-authn-client Secret.

That is an Admin-API *read* projected into a Secret, which is exactly what External
Secrets Operator does — so it is expressed as a webhook SecretStore + ExternalSecret
rather than a polling loop in a Job. ESO owns the refresh, so a rotated client secret
propagates on its own instead of requiring the Job to be re-run.

Two things this removes, both of which bit us before:
  - the wait-for-reconcile loop: ESO simply retries on its refreshInterval until the
    client exists, so there is no "not reconciled yet; retry N" ladder to tune.
  - the UUID lookup: the Job first resolved clientId -> id, then fetched
    /clients/{id}/client-secret. `GET /clients?clientId=<id>` already returns the
    client representation *including* `secret` for a confidential client, so one
    request replaces both — and, usefully, needs no server-generated id, the same
    property that made the keystone federation slice expressible.

The Job keeps doing this while federation.declarativeAuthnSecret is false, so the two
paths are mutually exclusive and the Job stays the default until this is proven live.
NB: needs ESO present in the child (it is — 40-job-keycloak-bootstrap already labels
keycloak-kog-client with external-secrets.io/type=webhook).
*/}}
{{- if .Values.federation.declarativeAuthnSecret | default false }}
{{- $ns := include "child-sso.namespace" . }}
{{- $kc := .Values.inCluster.keycloakBaseUrl }}
{{- $realm := .Values.realm }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: keycloak-admin-webhook
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  provider:
    webhook:
      {{/*
        remoteRef.key carries the clientId, so this store can serve any confidential
        client in the realm, not just krateo-authn.
      */}}
      url: "{{ $kc }}/admin/realms/{{ $realm }}/clients?clientId={{ `{{ .remoteRef.key }}` }}"
      headers:
        Authorization: "Bearer {{ `{{ .token }}` }}"
        Accept: application/json
      {{/*
        The admin token is short-lived and rotated by ESO elsewhere; read it fresh on
        every call rather than baking it in.
      */}}
      secrets:
        - name: token
          secretRef:
            name: keycloak-admin-token
            key: token
      result:
        {{/*
          Array response filtered by clientId; a confidential client carries `secret`
          in its representation. Empty until the client reconciles, which ESO treats as
          a retryable failure — that IS the wait loop the Job hand-rolled.
        */}}
        jsonPath: "$[0].secret"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: krateo-authn-client
  namespace: {{ $ns }}
  labels:
    {{- include "child-sso.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: keycloak-admin-webhook
    kind: SecretStore
  target:
    name: krateo-authn-client
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: krateo-authn
{{- end }}
