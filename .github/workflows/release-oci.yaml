name: release-oci

# Packages the chart under chart/ and publishes it to GHCR as an OCI Helm
# artifact on every semver tag. Pushing tag "0.1.1" publishes:
#   oci://ghcr.io/braghettos/charts/child-sso-federation:0.1.1
# NOTE: a freshly created ghcr package defaults to PRIVATE — flip it to public once.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  package-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Resolve version and registry
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "OCI_REPO=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package and push chart
        run: |
          d=chart
          sed -i "s/CHART_VERSION/${VERSION}/g" "$d/Chart.yaml"
          name=$(grep -E '^name:' "$d/Chart.yaml" | awk '{print $2}')
          helm package "$d" --destination .
          helm push "${name}-${VERSION}.tgz" "${OCI_REPO}"
          echo "Published ${OCI_REPO}/${name}:${VERSION}"
